name: Deploy Promteca
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
      - run: mkdir -p dist/src && cp index.html prompt.html styles.css dist/ && cp src/*.js dist/src/ && cp -R src/specs dist/src/ && cp output/pdf/promteca-user-guide.pdf dist/user-guide.pdf && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        uses: actions/deploy-pages@v4
        id: deployment
