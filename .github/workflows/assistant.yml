name: Personal assistant
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: personal-assistant
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - run: node server/cloud-run.js
        env:
          ASSISTANT_STATE_KEY: ${{ secrets.ASSISTANT_STATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
